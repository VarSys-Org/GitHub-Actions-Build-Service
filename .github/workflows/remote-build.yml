name: Remote Build Service

run-name: Remote build [team=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.team_id || github.event.client_payload.team_id || 'default-team' }} project=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project_id || github.event.client_payload.project_id || 'default-project' }}]

permissions:
  contents: read
  actions: read

concurrency:
  # A repeated source/profile request cancels the older duplicate. The build
  # admission step separately enforces team and project quotas.
  group: remote-build-dedup-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dedup_key || github.event.client_payload.dedup_key || github.run_id }}
  cancel-in-progress: true

on:
  repository_dispatch:
    types: [remote-build]
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Source code archive URL (skip to build from checkout)'
        required: false
      build_id:
        description: 'Unique build identifier'
        required: false
      callback_url:
        description: 'Optional webhook URL to notify when build completes'
        required: false
      project_type:
        description: 'Project type: auto (default), flutter, expo, capacitor'
        required: false
        default: 'auto'
      variant:
        description: 'Build variant: debug (default) or release'
        required: false
        default: 'debug'
      repo:
        description: 'Repo to build (e.g. VarSys-Org/Joint-Journey-web)'
        required: false
      flutter_version:
        description: 'Flutter version (e.g. 3.24.0). Leave empty for stable channel.'
        required: false
      build_channel:
        description: 'Build channel (staging or production)'
        required: false
        default: 'staging'
      store_callback_url:
        description: 'Callback URL for the Build Orchestrator'
        required: false
      source_file_id:
        description: 'Appwrite Storage file ID for the source archive'
        required: false
      team_id:
        description: 'Build service team quota identifier'
        required: false
      project_id:
        description: 'Build service project quota identifier'
        required: false
      dedup_key:
        description: 'Stable source/profile deduplication key'
        required: false

jobs:
  remote-build:
    runs-on: ubuntu-latest
    concurrency:
      group: remote-build-project-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project_id || github.event.client_payload.project_id || 'default-project' }}
      cancel-in-progress: false
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Checkout build service security helpers
        uses: actions/checkout@v4
        with:
          path: build-service
          persist-credentials: false

      - name: Setup Flutter (if Flutter project)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.flutter_version || github.event.client_payload.flutter_version || '' }}
          channel: 'stable'
          cache: true
        if: |
          (github.event_name == 'workflow_dispatch' && github.event.inputs.project_type == 'flutter') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.project_type == '') ||
          (github.event_name == 'repository_dispatch' && github.event.client_payload.project_type == 'flutter') ||
          (github.event_name == 'repository_dispatch' && github.event.client_payload.project_type == '') ||
          (github.event_name == 'repository_dispatch' && github.event.client_payload.project_type == null) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.project_type == 'auto') ||
          (github.event_name == 'repository_dispatch' && github.event.client_payload.project_type == 'auto')

      - name: Extract build info
        id: build_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_url || '' }}
          PAYLOAD_SOURCE_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_url || '' }}
          INPUT_SOURCE_FILE_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_file_id || '' }}
          PAYLOAD_SOURCE_FILE_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_file_id || '' }}
          INPUT_BUILD_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_id || '' }}
          PAYLOAD_BUILD_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_id || '' }}
          INPUT_CALLBACK_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.callback_url || '' }}
          PAYLOAD_CALLBACK_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.callback_url || '' }}
          INPUT_STORE_CALLBACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.store_callback_url || '' }}
          PAYLOAD_STORE_CALLBACK: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.store_callback_url || '' }}
          INPUT_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.variant || '' }}
          PAYLOAD_VARIANT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.variant || '' }}
          INPUT_PROJECT_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project_type || '' }}
          PAYLOAD_PROJECT_TYPE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.project_type || '' }}
          INPUT_REPO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repo || '' }}
          PAYLOAD_REPO: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo || '' }}
          INPUT_BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_channel || '' }}
          PAYLOAD_BUILD_CHANNEL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.build_channel || '' }}
          INPUT_TEAM_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.team_id || '' }}
          PAYLOAD_TEAM_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.team_id || '' }}
          INPUT_PROJECT_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project_id || '' }}
          PAYLOAD_PROJECT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.project_id || '' }}
          INPUT_DEDUP_KEY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dedup_key || '' }}
          PAYLOAD_DEDUP_KEY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dedup_key || '' }}
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_BUCKET_ID: ${{ secrets.APPWRITE_BUCKET_ID }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SOURCE_URL="$INPUT_SOURCE_URL"
            SOURCE_FILE_ID="$INPUT_SOURCE_FILE_ID"
            BUILD_ID="$INPUT_BUILD_ID"
            CALLBACK_URL="$INPUT_CALLBACK_URL"
            STORE_CALLBACK="$INPUT_STORE_CALLBACK"
            VARIANT="$INPUT_VARIANT"
            PROJECT_TYPE="$INPUT_PROJECT_TYPE"
            REPO="$INPUT_REPO"
            BUILD_CHANNEL="$INPUT_BUILD_CHANNEL"
            TEAM_ID="$INPUT_TEAM_ID"
            PROJECT_ID="$INPUT_PROJECT_ID"
            DEDUP_KEY="$INPUT_DEDUP_KEY"
          else
            SOURCE_URL="$PAYLOAD_SOURCE_URL"
            SOURCE_FILE_ID="$PAYLOAD_SOURCE_FILE_ID"
            BUILD_ID="$PAYLOAD_BUILD_ID"
            CALLBACK_URL="$PAYLOAD_CALLBACK_URL"
            STORE_CALLBACK="$PAYLOAD_STORE_CALLBACK"
            VARIANT="$PAYLOAD_VARIANT"
            PROJECT_TYPE="$PAYLOAD_PROJECT_TYPE"
            REPO="$PAYLOAD_REPO"
            BUILD_CHANNEL="$PAYLOAD_BUILD_CHANNEL"
            TEAM_ID="$PAYLOAD_TEAM_ID"
            PROJECT_ID="$PAYLOAD_PROJECT_ID"
            DEDUP_KEY="$PAYLOAD_DEDUP_KEY"
          fi
          
          # Default to release if no variant specified
          VARIANT="${VARIANT:-release}"
          PROJECT_TYPE="${PROJECT_TYPE:-auto}"
          BUILD_CHANNEL="${BUILD_CHANNEL:-staging}"
          BUILD_ID="${BUILD_ID:-$(date +%s)}"
          TEAM_ID="${TEAM_ID:-default-team}"
          PROJECT_ID="${PROJECT_ID:-default-project}"
          DEDUP_KEY="${DEDUP_KEY:-$BUILD_ID}"

          # Legacy source_url is accepted only as an input to the validator;
          # the output contains the validated file ID, never the raw URL.
          if [ -z "$SOURCE_FILE_ID" ] && [ -n "$SOURCE_URL" ]; then
            SOURCE_URL_INPUT="$SOURCE_URL" SOURCE_FILE_ID="" node build-service/cli/security.js source-file-id > /tmp/source-file-id
            SOURCE_FILE_ID=$(cat /tmp/source-file-id)
          fi

          if [ -n "$SOURCE_FILE_ID" ]; then
            SOURCE_FILE_ID="$SOURCE_FILE_ID" node build-service/cli/security.js source-url > /dev/null
          fi
          case "$BUILD_ID" in ''|*[!A-Za-z0-9._-]*) echo "Invalid build ID" >&2; exit 1 ;; esac
          case "$TEAM_ID" in ''|*[!A-Za-z0-9._-]*) echo "Invalid team ID" >&2; exit 1 ;; esac
          case "$PROJECT_ID" in ''|*[!A-Za-z0-9._-]*) echo "Invalid project ID" >&2; exit 1 ;; esac
          case "$DEDUP_KEY" in ''|*[!A-Za-z0-9._-]*) echo "Invalid deduplication key" >&2; exit 1 ;; esac
          case "$VARIANT" in ''|*[!A-Za-z0-9._-]*) echo "Invalid variant" >&2; exit 1 ;; esac
          case "$PROJECT_TYPE" in ''|*[!A-Za-z0-9._-]*) echo "Invalid project type" >&2; exit 1 ;; esac
          case "$BUILD_CHANNEL" in ''|*[!A-Za-z0-9._-]*) echo "Invalid build channel" >&2; exit 1 ;; esac
          case "$REPO" in '') ;; *[!A-Za-z0-9._/-]*) echo "Invalid repository" >&2; exit 1 ;; esac

          echo "SOURCE_URL=${SOURCE_FILE_ID:+requested}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_FILE_ID=$SOURCE_FILE_ID" >> "$GITHUB_OUTPUT"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_OUTPUT"
          printf 'CALLBACK_URL_B64=%s\n' "$(printf '%s' "$CALLBACK_URL" | base64 -w0)" >> "$GITHUB_OUTPUT"
          printf 'STORE_CALLBACK_URL_B64=%s\n' "$(printf '%s' "$STORE_CALLBACK" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "VARIANT=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "PROJECT_TYPE=$PROJECT_TYPE" >> "$GITHUB_OUTPUT"
          echo "REPO=$REPO" >> "$GITHUB_OUTPUT"
          echo "BUILD_CHANNEL=$BUILD_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "TEAM_ID=${TEAM_ID:-default-team}" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ID=${PROJECT_ID:-default-project}" >> "$GITHUB_OUTPUT"
          echo "DEDUP_KEY=${DEDUP_KEY:-$BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: Enforce build quotas
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_TEAM_ID: ${{ steps.build_info.outputs.TEAM_ID }}
          BUILD_PROJECT_ID: ${{ steps.build_info.outputs.PROJECT_ID }}
          BUILD_MAX_TEAM_CONCURRENCY: ${{ secrets.BUILD_MAX_TEAM_CONCURRENCY }}
          BUILD_MAX_PROJECT_CONCURRENCY: ${{ secrets.BUILD_MAX_PROJECT_CONCURRENCY }}
          BUILD_ALLOWED_TEAMS: ${{ secrets.BUILD_ALLOWED_TEAMS }}
          BUILD_ALLOWED_PROJECTS: ${{ secrets.BUILD_ALLOWED_PROJECTS }}
        run: node build-service/cli/security.js quota

      - name: Checkout source repo (if no source_url)
        uses: actions/checkout@v4
        if: steps.build_info.outputs.SOURCE_URL == '' && steps.build_info.outputs.REPO != ''
        with:
          repository: ${{ steps.build_info.outputs.REPO }}
          path: project
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Download source code (from Appwrite)
        if: steps.build_info.outputs.SOURCE_URL != '' || steps.build_info.outputs.SOURCE_FILE_ID != ''
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_BUCKET_ID: ${{ secrets.APPWRITE_BUCKET_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          SOURCE_FILE_ID: ${{ steps.build_info.outputs.SOURCE_FILE_ID }}
        run: |
          SOURCE_URL=$(node build-service/cli/security.js source-url)
          echo "Downloading source from the configured Appwrite endpoint"
          curl -L -o source.tar.gz \
            --fail --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
            -H "X-Appwrite-Project: ${{ secrets.APPWRITE_PROJECT_ID }}" \
            -H "X-Appwrite-Key: $APPWRITE_API_KEY" \
            "$SOURCE_URL"
          mkdir -p project
          tar -xzf source.tar.gz -C project
          ls -la project/

      - name: Cache dependencies
        uses: actions/cache@v4
        if: steps.build_info.outputs.PROJECT_TYPE != 'flutter'
        with:
          path: |
            project/node_modules
            ~/.npm
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-deps-${{ hashFiles('project/package-lock.json', 'project/pnpm-lock.yaml', 'project/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.android/avd
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('project/android/build.gradle', 'project/android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install dependencies
        working-directory: project
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Flutter project — running flutter pub get"
            flutter pub get
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "pnpm project detected"
            corepack enable
            pnpm install --ignore-scripts
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Create .env file (if secrets provided)
        working-directory: project
        run: |
          cat > .env << EOF
          # Build Service storage config
          APPWRITE_ENDPOINT=${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID=${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID=${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_COLLECTION_ID=${{ secrets.APPWRITE_COLLECTION_ID }}
          APPWRITE_BUCKET_ID=${{ secrets.APPWRITE_BUCKET_ID }}
          # Project Appwrite config (for Capacitor/Vite apps)
          VITE_APPWRITE_ENDPOINT=${{ secrets.JJ_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID=${{ secrets.JJ_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID=${{ secrets.JJ_APPWRITE_DATABASE_ID }}
          EOF

      - name: Prepare Android project (Expo or Capacitor)
        working-directory: project
        if: "!contains(fromJson('[\"flutter\"]'), steps.build_info.outputs.PROJECT_TYPE) && !( steps.build_info.outputs.PROJECT_TYPE == 'auto' && hashFiles('project/pubspec.yaml') != '' )"
        run: |
          echo "Detecting project type..."

          if [ -f "capacitor.config.ts" ] || [ -f "capacitor.config.js" ] || [ -f "capacitor.config.json" ]; then
            echo "Capacitor project detected"
            if grep -q '"cap:build"' package.json; then
              if [ -f "pnpm-lock.yaml" ]; then
                corepack enable && pnpm cap:build
              else
                npm run cap:build
              fi
            else
              npm run build
              npx cap sync android
            fi
          elif [ -f "app.json" ] || [ -f "app.config.js" ] || [ -f "app.config.ts" ]; then
            echo "Expo project detected"
            npx expo prebuild --platform android --clean
          elif [ -d "android" ]; then
            echo "Using existing android directory"
          else
            echo "No supported mobile project structure found"
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "android directory was not generated"
            exit 1
          fi

          # Fix gradlew permissions
          chmod +x android/gradlew 2>/dev/null || true

      - name: Build Flutter APK
        working-directory: project
        if: steps.build_info.outputs.PROJECT_TYPE == 'flutter' || ( steps.build_info.outputs.PROJECT_TYPE == 'auto' && hashFiles('project/pubspec.yaml') != '' )
        run: |
          VARIANT="${{ steps.build_info.outputs.VARIANT }}"
          if [ "$VARIANT" = "release" ]; then
            flutter build apk --release --no-pub
            flutter build appbundle --release --no-pub
          else
            flutter build apk --debug --no-pub
          fi
          echo "Flutter build complete"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            project/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('project/android/gradle/wrapper/gradle-wrapper.properties', 'project/android/build.gradle', 'project/android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Verify JVM Memory Settings (Fast Check)
        working-directory: project/android
        if: steps.build_info.outputs.PROJECT_TYPE != 'flutter'
        env:
          GRADLE_OPTS: -Xmx7g -XX:MaxMetaspaceSize=3g -XX:+HeapDumpOnOutOfMemoryError
          JAVA_TOOL_OPTIONS: -Xmx7g -XX:MaxMetaspaceSize=3g
        run: |
          echo "========================================="
          echo "JVM MEMORY CONFIGURATION VERIFICATION"
          echo "========================================="
          echo "GRADLE_OPTS: $GRADLE_OPTS"
          echo "JAVA_TOOL_OPTIONS: $JAVA_TOOL_OPTIONS"
          echo ""
          echo "Running Gradle with memory diagnostics..."
          ./gradlew --version --no-daemon | head -20
          echo ""
          echo "Testing KSP compilation environment..."
          ./gradlew tasks --no-daemon | grep -i ksp || echo "KSP tasks available"
          echo ""
          echo "✅ Memory settings verified! Heap: 7GB (MAX), Metaspace: 3GB (MAX)"
          echo "⚡ Future-proofed for projects with 100+ dependencies"
          echo "========================================="

      - name: Build Android APK
        working-directory: project/android
        if: steps.build_info.outputs.PROJECT_TYPE != 'flutter'
        env:
          GRADLE_OPTS: -Xmx4g
        run: |
          chmod +x gradlew
          VARIANT="${{ steps.build_info.outputs.VARIANT }}"
          VARIANT_CAPITALIZED="$(echo ${VARIANT^})"
          echo "Building variant: $VARIANT"
          ./gradlew assemble${VARIANT_CAPITALIZED} --no-daemon

      - name: Build Android AAB
        working-directory: project/android
        if: steps.build_info.outputs.PROJECT_TYPE != 'flutter'
        env:
          GRADLE_OPTS: -Xmx4g
        run: |
          chmod +x gradlew
          VARIANT="${{ steps.build_info.outputs.VARIANT }}"
          VARIANT_CAPITALIZED="$(echo ${VARIANT^})"
          ./gradlew bundle${VARIANT_CAPITALIZED} --no-daemon

      - name: Rename artifacts
        run: |
          BUILD_ID="${{ steps.build_info.outputs.BUILD_ID }}"
          BUILD_NUM="${{ steps.build_info.outputs.BUILD_NUMBER }}"
          VARIANT="${{ steps.build_info.outputs.VARIANT }}"
          PROJECT_TYPE="${{ steps.build_info.outputs.PROJECT_TYPE }}"
          
          if [ "$PROJECT_TYPE" = "flutter" ]; then
            # Flutter output paths
            APK_PATH=$(find project/build/app/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
            AAB_PATH=$(find project/build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          else
            # Expo/Capacitor/RN output paths
            APK_PATH=$(find project/android/app/build/outputs/apk/$VARIANT -name "*.apk" | head -n 1)
            AAB_PATH=$(find project/android/app/build/outputs/bundle/${VARIANT} -name "*.aab" | head -n 1)
          fi

          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "build-${BUILD_ID}-${BUILD_NUM}-${VARIANT}.apk"
            echo "Found APK: $APK_PATH"
          fi

          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" "build-${BUILD_ID}-${BUILD_NUM}-${VARIANT}.aab"
            echo "Found AAB: $AAB_PATH"
          fi

          if [ -z "$APK_PATH" ] && [ -z "$AAB_PATH" ]; then
            echo "No APK or AAB artifacts were found"
            exit 1
          fi

      - name: Upload to Appwrite Storage
        id: upload
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_BUCKET_ID: ${{ secrets.APPWRITE_BUCKET_ID }}
          BUILD_ID: ${{ steps.build_info.outputs.BUILD_ID }}
          BUILD_NUM: ${{ steps.build_info.outputs.BUILD_NUMBER }}
        run: |
          npm install node-appwrite
          node -e "
          const { Client, Storage, ID } = require('node-appwrite');
          const { InputFile } = require('node-appwrite/file');
          const fs = require('fs');

          const client = new Client()
            .setEndpoint(process.env.APPWRITE_ENDPOINT)
            .setProject(process.env.APPWRITE_PROJECT_ID)
            .setKey(process.env.APPWRITE_API_KEY);

          const storage = new Storage(client);

          async function upload() {
            const apkFile = fs.readdirSync('.').find(f => f.endsWith('.apk'));
            const aabFile = fs.readdirSync('.').find(f => f.endsWith('.aab'));

            if (!apkFile && !aabFile) {
              throw new Error('No APK or AAB files found for upload');
            }

            let apkResult = null;
            let aabResult = null;

            if (apkFile) {
              apkResult = await storage.createFile(
                process.env.APPWRITE_BUCKET_ID,
                ID.unique(),
                InputFile.fromPath(apkFile, apkFile)
              );
            }

            if (aabFile) {
              aabResult = await storage.createFile(
                process.env.APPWRITE_BUCKET_ID,
                ID.unique(),
                InputFile.fromPath(aabFile, aabFile)
              );
            }

            console.log('APK_FILE_ID=' + (apkResult ? apkResult.\$id : ''));
            console.log('AAB_FILE_ID=' + (aabResult ? aabResult.\$id : ''));
          }

          upload().catch(console.error);
          " | tee -a $GITHUB_OUTPUT

      - name: Send callback notification
        if: steps.build_info.outputs.CALLBACK_URL_B64 != ''
        env:
          CALLBACK_URL_B64: ${{ steps.build_info.outputs.CALLBACK_URL_B64 }}
          CALLBACK_ALLOWED_HOSTS: ${{ secrets.CALLBACK_ALLOWED_HOSTS }}
          CALLBACK_SIGNING_SECRET: ${{ secrets.CALLBACK_SIGNING_SECRET }}
          BUILD_ID: ${{ steps.build_info.outputs.BUILD_ID }}
          APK_FILE_ID: ${{ steps.upload.outputs.APK_FILE_ID }}
          AAB_FILE_ID: ${{ steps.upload.outputs.AAB_FILE_ID }}
          APK_URL: ${{ steps.upload.outputs.APK_URL }}
          BUILD_NUMBER: ${{ steps.build_info.outputs.BUILD_NUMBER }}
        run: |
          export CALLBACK_URL="$(printf '%s' "$CALLBACK_URL_B64" | base64 -d)"
          export CALLBACK_PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({build_id: process.env.BUILD_ID, status: "success", apk_file_id: process.env.APK_FILE_ID || "", aab_file_id: process.env.AAB_FILE_ID || "", apk_url: process.env.APK_URL || "", build_number: process.env.BUILD_NUMBER}))')"
          node build-service/cli/security.js callback

      - name: Notify Build Orchestrator
        if: steps.build_info.outputs.STORE_CALLBACK_URL_B64 != ''
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_BUCKET_ID: ${{ secrets.APPWRITE_BUCKET_ID }}
          APK_PATH: ${{ steps.upload.outputs.APK_FILE_ID }}
          BUILD_NUM: ${{ steps.build_info.outputs.BUILD_NUMBER }}
          CALLBACK_URL_B64: ${{ steps.build_info.outputs.STORE_CALLBACK_URL_B64 }}
          CALLBACK_ALLOWED_HOSTS: ${{ secrets.CALLBACK_ALLOWED_HOSTS }}
          CALLBACK_SIGNING_SECRET: ${{ secrets.CALLBACK_SIGNING_SECRET }}
        run: |
          export CALLBACK_URL="$(printf '%s' "$CALLBACK_URL_B64" | base64 -d)"
          APK_FILE_ID="${{ steps.upload.outputs.APK_FILE_ID }}"
          APK_URL=""
          FILE_SIZE=0
          
          # Find the actual APK file to get its size
          if [ -n "$APK_FILE_ID" ]; then
            APK_URL="$(APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" APPWRITE_BUCKET_ID="$APPWRITE_BUCKET_ID" SOURCE_FILE_ID="$APK_FILE_ID" node build-service/cli/security.js source-url)?project=${APPWRITE_PROJECT_ID}"
            # Try to get file info via Appwrite API
            FILE_INFO=$(curl -s \
              --fail --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 \
              -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
              -H "X-Appwrite-Key: $APPWRITE_API_KEY" \
              "${APPWRITE_ENDPOINT}/storage/buckets/${APPWRITE_BUCKET_ID}/files/${APK_FILE_ID}")
            FILE_SIZE=$(echo "$FILE_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sizeOriginal', 0))" 2>/dev/null || echo "0")
          fi
          
          STATUS="completed"
          ERROR_MSG=""
          if [ -z "$APK_FILE_ID" ]; then
            STATUS="failed"
            ERROR_MSG="No APK file was produced"
          fi
          
          export CALLBACK_PAYLOAD="$(STATUS="$STATUS" APK_FILE_ID="$APK_FILE_ID" APK_URL="$APK_URL" FILE_SIZE="$FILE_SIZE" BUILD_NUM="$BUILD_NUM" ERROR_MSG="$ERROR_MSG" node -e 'process.stdout.write(JSON.stringify({status: process.env.STATUS, apk_file_id: process.env.APK_FILE_ID || "", apk_file_url: process.env.APK_URL || "", file_size: Number(process.env.FILE_SIZE || 0), build_number: process.env.BUILD_NUM, error_message: process.env.ERROR_MSG || ""}))')"
          node build-service/cli/security.js callback

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: remote-build-${{ steps.build_info.outputs.BUILD_ID }}
          path: |
            *.apk
            *.aab
          retention-days: 7
